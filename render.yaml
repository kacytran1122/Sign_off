services:
  - type: web
    name: signoff
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: signoff-db
          property: connectionString
      - key: PROPERTY_CONFIG
        value: /etc/secrets/property.json
      - key: PUBLIC_BASE_URL
        sync: false
      - key: PHOTON_PROJECT_ID
        sync: false
      - key: PHOTON_API_KEY
        sync: false
      - key: PHOTON_WEBHOOK_SECRET
        sync: false
      - key: MATTERPORT_SDK_KEY
        sync: false
      - key: MANAGER_HANDLE
        sync: false
      - key: TENANT_SUITES_JSON
        sync: false
databases:
  - name: signoff-db
