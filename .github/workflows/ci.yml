name: Signoff CI and package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check repository files
        run: |
          if git ls-files | grep -Ei '/readme\.md$|\.html$|(^|/)\.claude(/|$)'; then
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Run backend tests
        run: npm run test:backend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run frontend tests
        run: npm run test:frontend
      - name: Package verified main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git archive --format=tar HEAD > "$RUNNER_TEMP/signoff.tar"
          tar --exclude=frontend/.next/cache -rf "$RUNNER_TEMP/signoff.tar" build/backend frontend/.next
          gzip "$RUNNER_TEMP/signoff.tar"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: signoff
          path: ${{ runner.temp }}/signoff.tar.gz
          if-no-files-found: error
